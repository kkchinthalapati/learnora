<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav aria-label="Main navigation" style="width:248px;height:100%;min-height:760px;display:flex;flex-direction:column;gap:20px;padding:20px 14px;background:#f0ece3;border-right:1px solid #e2ddd1;font-family:'Instrument Sans',system-ui,sans-serif;box-sizing:border-box;color:#1a1815">
  <div style="display:flex;align-items:center;gap:10px;padding:0 6px">
    <span style="width:30px;height:30px;border-radius:5px;background:#0f766e;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:'Newsreader',Georgia,serif;font-size:19px;font-weight:600">L</span>
    <span style="font-family:'Newsreader',Georgia,serif;font-size:22px;font-weight:600;letter-spacing:-0.015em">Learnora</span>
  </div>
  <button style="display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border:1px solid #e2ddd1;border-radius:8px;background:#fbfaf7;color:#625c50;font:inherit;font-size:13px;cursor:pointer;text-align:left" style-hover="border-color:#9cc6c0">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <span style="flex:1">Search or jump to…</span>
    <kbd style="font-family:'JetBrains Mono',monospace;font-size:11px;padding:1px 5px;border:1px solid #e2ddd1;border-radius:3px;background:#fff">⌘K</kbd>
  </button>
  <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px">
    <li style="position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:600;color:#3d3830;cursor:pointer">
      <sc-if value="{{ isToday }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0;background:#e1ece9;border-radius:8px;box-shadow:inset 3px 0 0 #0f766e"></span></sc-if>
      <svg style="position:relative" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>
      <span style="position:relative;flex:1">Today</span>
    </li>
    <li style="position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:600;color:#3d3830;cursor:pointer">
      <sc-if value="{{ isLibrary }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0;background:#e1ece9;border-radius:8px;box-shadow:inset 3px 0 0 #0f766e"></span></sc-if>
      <svg style="position:relative" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2.5 2.5 7.5 12 12.5 21.5 7.5 12 2.5"></polygon><polyline points="2.5 12.5 12 17.5 21.5 12.5"></polyline><polyline points="2.5 17.5 12 22.5 21.5 17.5"></polyline></svg>
      <span style="position:relative;flex:1">Library</span>
    </li>
    <li style="position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:600;color:#3d3830;cursor:pointer">
      <sc-if value="{{ isStudy }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0;background:#e1ece9;border-radius:8px;box-shadow:inset 3px 0 0 #0f766e"></span></sc-if>
      <svg style="position:relative" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"></circle></svg>
      <span style="position:relative;flex:1">Study</span>
    </li>
    <li style="position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:600;color:#3d3830;cursor:pointer">
      <sc-if value="{{ isPlan }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0;background:#e1ece9;border-radius:8px;box-shadow:inset 3px 0 0 #0f766e"></span></sc-if>
      <svg style="position:relative" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"></rect><line x1="3" y1="9.5" x2="21" y2="9.5"></line><line x1="8" y1="2.5" x2="8" y2="6.5"></line><line x1="16" y1="2.5" x2="16" y2="6.5"></line><circle cx="15.5" cy="15" r="1.4" fill="currentColor" stroke="none"></circle></svg>
      <span style="position:relative;flex:1">Plan</span>
    </li>
    <li style="position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:600;color:#3d3830;cursor:pointer">
      <sc-if value="{{ isProgress }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0;background:#e1ece9;border-radius:8px;box-shadow:inset 3px 0 0 #0f766e"></span></sc-if>
      <svg style="position:relative" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
      <span style="position:relative;flex:1">Progress</span>
    </li>
  </ul>
  <div style="height:1px;background:#e2ddd1;margin:0 6px"></div>
  <button onClick="{{ onAsk }}" style="display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#0b5c55;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left" style-hover="background:#e1ece9">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>
    <span style="flex:1">Ask the tutor</span>
    <kbd style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#625c50;padding:1px 5px;border:1px solid #d5dfdb;border-radius:3px;background:#fff">⌘J</kbd>
  </button>
  <div style="flex:1"></div>
  <sc-if value="{{ session }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid #cfe0dc;border-radius:8px;background:#fbfaf7">
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#0b5c55">Session paused</span>
      <span style="font-size:13px;font-weight:600">Cellular respiration</span>
      <span style="font-size:12px;color:#625c50">Step 3 of 5 · 12 min left</span>
    </div>
  </sc-if>
  <div style="display:flex;flex-direction:column;gap:2px">
    <div style="display:flex;align-items:center;gap:12px;height:36px;padding:0 10px;font-size:13px;font-weight:500;color:#625c50">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><circle cx="10" cy="8" r="3.5"></circle><path d="M3 20a7 7 0 0 1 14 0"></path><path d="M16.5 5.2a3.5 3.5 0 0 1 0 6.6"></path><path d="M18 14.3A7 7 0 0 1 21 20"></path></svg>
      <span>Study room &amp; friends</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid #e2ddd1;margin-top:6px">
      <span style="width:28px;height:28px;border-radius:999px;background:#d8d2c4;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#3d3830">MR</span>
      <span style="flex:1;display:flex;flex-direction:column;line-height:1.25"><span style="font-size:13px;font-weight:600">Maya Rao</span><span style="font-size:12px;color:#625c50">Settings</span></span>
    </div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:248,&quot;height&quot;:800},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;today&quot;,&quot;library&quot;,&quot;study&quot;,&quot;plan&quot;,&quot;progress&quot;],&quot;default&quot;:&quot;today&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;session&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onAsk&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? "today";
    return {
      isToday: a === "today", isLibrary: a === "library", isStudy: a === "study",
      isPlan: a === "plan", isProgress: a === "progress",
      session: this.props.session ?? false,
      onAsk: this.props.onAsk ?? (() => {}),
    };
  }
}
</script>
</body>
</html>
