<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
        />
        <meta name="color-scheme" content="light dark" />
        <title>404 - Page Not Found | Learnora</title>
        <link rel="icon" href="/learnora-mark.svg" type="image/svg+xml" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..500&family=Caveat:wght@500..600&display=swap" rel="stylesheet">
        <!-- Same page as the landing (landing.css): the exercise book. -->
        <link rel="stylesheet" href="/landing.css" />
    </head>
    <body>
        <header class="nav">
            <div class="wrap nav__inner">
                <a class="brand" href="/" aria-label="Learnora home">
                    <svg class="brand__mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
                        <path d="M20 12V48H46" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                        <path class="brand__tick" d="M30 30.5l5.5 5.5L48 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Learnora</span>
                </a>
                <div class="nav__actions">
                    <a class="link-quiet" href="/app/login">Sign in</a>
                    <a class="btn btn--primary btn--sm" href="/app/signup">Start free</a>
                </div>
            </div>
        </header>
        <main class="hero">
            <div class="wrap">
                <p class="eyebrow">Error 404</p>
                <h1 class="hero__title">This page <span class="hl">isn't here</span>.</h1>
                <p class="lede">The address may be old or mistyped. Nothing you saved is affected.</p>
                <p class="margin-note">not a mistake you need to fix</p>
                <div class="hero__ctas">
                    <a class="btn btn--primary" href="/app/">Open your study app</a>
                    <a class="btn btn--ghost" href="/">Learnora home</a>
                </div>
            </div>
        </main>
    </body>
</html>
