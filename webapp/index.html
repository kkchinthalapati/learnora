<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Same icon the vanilla app uses (terms.html's <link rel="icon">), not
         Vite's template logo. Vite prefixes this with the build's `base`. -->
    <link rel="icon" type="image/jpeg" href="/learnora.jpg" />
    <link rel="apple-touch-icon" href="/learnora.jpg" />
    <!-- Vite prefixes this with the build's `base`, same as the favicon
         above — the manifest itself still needs its own start_url/scope
         hardcoded to /app/ since it's a static file Vite doesn't process. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0e0d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Outfit/Plus Jakarta Sans were the only two families actually loaded
         here, even though the Appearance settings' font picker has always
         offered Inter and JetBrains Mono too — those two rendered as
         whatever the browser's own sans-serif/monospace fallback was, not
         the named font. Fixed alongside adding Atkinson Hyperlegible (an
         OFL, purpose-built low-vision/dyslexia-friendly face) as a 5th
         option, rather than shipping one more entry into the same gap.

         Source Serif 4 (OFL) is the reading face for long AI prose — see
         --font-read in tokens.css. A text serif is easier to read a few
         paragraphs of explanation in than the UI sans, which is drawn for
         labels and buttons. -->
    <!-- One href. This tag carried two: the first (kept below) names the
         current families, the second was the pre-Newsreader set left behind by
         an edit. A duplicate attribute is a parse error the browser recovers
         from by keeping the first and dropping the rest, so the right fonts
         did load — but only by luck of ordering, and deleting the "extra"
         line would have silently swapped the brand's typefaces for fallbacks. -->
    <!-- Loaded without blocking the first paint.

         As a plain stylesheet this was render-blocking: the browser will not
         paint anything until it arrives, so every first load in the app was
         gated on a third party. Measured with the request failing: 12.5s to
         first paint, against 1.5s once it resolves — a blank page for as long
         as fonts.googleapis.com takes, and indefinitely where it is blocked
         or firewalled.

         `media="print"` makes it non-blocking (print styles are not needed to
         paint the screen); the onload swaps it to `all` the moment it lands,
         at which point the real faces apply. That trades the block for a brief
         flash of the fallback stack — which the URL's own `display=swap`
         already opted into for the font *files*, so this only extends the same
         decision to the stylesheet that names them. The <noscript> copy keeps
         the fonts for scripted-off browsers, where the swap can never run. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Learnora</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
